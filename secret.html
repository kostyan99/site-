<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; touch-action: none; }
canvas { display: block; position: absolute; inset: 0; }
#ui {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
#hint-group {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  transition: opacity 0.6s ease;
}
#hint-group.hidden { opacity: 0; pointer-events: none; }
#hint-text {
  font-family: 'Georgia', serif;
  font-size: clamp(14px, 4vw, 22px);
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px rgba(180,140,255,0.7), 0 0 40px rgba(120,80,220,0.4);
  text-align: center;
}
.arr-svg { width: clamp(24px,5vw,36px); height: clamp(24px,5vw,36px); }
.row { display: flex; align-items: center; gap: 8px; }
#secret-text {
  position: absolute;
  font-family: 'Georgia', serif;
  font-size: clamp(15px, 4vw, 30px);
  color: rgba(255,255,255,0);
  text-align: center;
  letter-spacing: 0.1em;
  text-shadow: none;
  transition: color 1.2s ease, text-shadow 1.2s ease;
  white-space: nowrap;
  padding: 0 16px;
}
#secret-text.revealed {
  color: rgba(255,255,255,0.95);
  text-shadow: 0 0 30px rgba(180,140,255,0.9), 0 0 70px rgba(120,80,220,0.5), 0 0 120px rgba(80,40,180,0.3);
}
#counter {
  position: absolute;
  bottom: 20px; right: 20px;
  font-family: 'Georgia', serif;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.1em;
}
#ripple-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.ripple {
  position: absolute; border-radius: 50%;
  border: 1.5px solid rgba(180,140,255,0.6);
  transform: translate(-50%,-50%) scale(0);
  animation: rA 1.4s ease-out forwards;
}
@keyframes rA { to { transform: translate(-50%,-50%) scale(8); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ripple-container"></div>
<div id="ui">
  <div id="hint-group">
    <div class="row" id="top-arrows">
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,8 18,28" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,20 18,28 26,20" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,8 18,28" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,20 18,28 26,20" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,8 18,28" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,20 18,28 26,20" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="row" id="left-arrows">
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="8,18 28,18" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round"/><polyline points="20,10 28,18 20,26" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="8,18 28,18" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round"/><polyline points="20,10 28,18 20,26" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="8,18 28,18" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round"/><polyline points="20,10 28,18 20,26" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div id="hint-text">нажми, чтобы открыть</div>
      <div class="row" id="right-arrows">
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="28,18 8,18" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round"/><polyline points="16,10 8,18 16,26" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="28,18 8,18" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round"/><polyline points="16,10 8,18 16,26" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="28,18 8,18" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round"/><polyline points="16,10 8,18 16,26" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="row" id="bot-arrows">
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,28 18,8" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,16 18,8 26,16" fill="none" stroke="rgba(220,180,255,0.5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,28 18,8" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,16 18,8 26,16" fill="none" stroke="rgba(200,160,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arr-svg" viewBox="0 0 36 36"><polyline points="18,28 18,8" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round"/><polyline points="10,16 18,8 26,16" fill="none" stroke="rgba(180,140,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="secret-text"></div>
</div>
<div id="counter"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const secretText = document.getElementById('secret-text');
const hintGroup = document.getElementById('hint-group');
const rippleContainer = document.getElementById('ripple-container');
const counter = document.getElementById('counter');
 
// ✏️ ТВОИ НАДПИСИ — меняй и добавляй сколько хочешь
const MESSAGES = [
  "ЮЛЬКА ! ",
  "ТЫ У МЕНЯ ",
  "САМАЯ ЛУЧШАЯ ❤️"
];
 
let msgIndex = -1;
let W, H, particles = [], stars = [];
let time = 0;
const isMobile = window.innerWidth < 768;
 
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initStars();
}
 
function initStars() {
  const count = isMobile ? 120 : 200;
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      alpha: Math.random() * 0.7 + 0.1,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.3 + 0.05
    });
  }
}
 
let arrowT = 0, arrowRAF = null;
function animateArrows() {
  arrowT += 0.04;
  document.querySelectorAll('#top-arrows .arr-svg').forEach((a, i) => {
    a.style.transform = `translateY(${Math.abs(Math.sin(arrowT - i * 0.5)) * 7}px)`;
  });
  document.querySelectorAll('#bot-arrows .arr-svg').forEach((a, i) => {
    a.style.transform = `translateY(${-Math.abs(Math.sin(arrowT - i * 0.5)) * 7}px)`;
  });
  document.querySelectorAll('#left-arrows .arr-svg').forEach((a, i) => {
    a.style.transform = `translateX(${Math.abs(Math.sin(arrowT - i * 0.5)) * 7}px)`;
  });
  document.querySelectorAll('#right-arrows .arr-svg').forEach((a, i) => {
    a.style.transform = `translateX(${-Math.abs(Math.sin(arrowT - i * 0.5)) * 7}px)`;
  });
  arrowRAF = requestAnimationFrame(animateArrows);
}
animateArrows();
 
class Particle {
  constructor(x, y, fromClick) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = fromClick ? Math.random() * 5 + 2 : Math.random() * 1.2 + 0.3;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = fromClick ? Math.random() * 0.012 + 0.008 : Math.random() * 0.006 + 0.003;
    this.r = fromClick ? Math.random() * 3 + 1 : Math.random() * 1.5 + 0.5;
    this.hue = fromClick ? 260 + Math.random() * 60 : 220 + Math.random() * 80;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.97; this.vy *= 0.97; this.vy += 0.02;
    this.life -= this.decay;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 75%, 70%, ${this.life})`;
    ctx.fill();
  }
}
 
function spawnBurst(x, y) {
  const count = isMobile ? 50 : 90;
  for (let i = 0; i < count; i++) particles.push(new Particle(x, y, true));
}
 
function createRipple(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = '40px'; el.style.height = '40px';
  rippleContainer.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
 
function showMessage(idx) {
  secretText.classList.remove('revealed');
  setTimeout(() => {
    secretText.textContent = MESSAGES[idx];
    secretText.classList.add('revealed');
  }, 300);
}
 
function updateCounter() {
  counter.textContent = msgIndex >= 0 ? `${msgIndex + 1} / ${MESSAGES.length}` : '';
}
 
function handleTap(x, y) {
  spawnBurst(x, y);
  createRipple(x, y);
  if (msgIndex === -1) {
    msgIndex = 0;
    hintGroup.classList.add('hidden');
    cancelAnimationFrame(arrowRAF);
    setTimeout(() => { hintGroup.style.display = 'none'; }, 700);
    secretText.textContent = MESSAGES[0];
    secretText.classList.add('revealed');
  } else {
    msgIndex = (msgIndex + 1) % MESSAGES.length;
    showMessage(msgIndex);
  }
  updateCounter();
}
 
canvas.addEventListener('click', e => handleTap(e.clientX, e.clientY));
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });
 
function drawNebula() {
  const cx = W / 2, cy = H / 2;
  const pulse = Math.sin(time * 0.018) * 0.15 + 0.85;
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W,H) * 0.5 * pulse);
  g.addColorStop(0, `rgba(90,40,160,${msgIndex >= 0 ? 0.2 : 0.08})`);
  g.addColorStop(0.5, 'rgba(40,20,100,0.04)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
 
function drawAurora() {
  const cy = H / 2;
  ctx.save(); ctx.globalAlpha = 0.035 + (msgIndex >= 0 ? 0.05 : 0);
  for (let i = 0; i < 3; i++) {
    const offset = Math.sin(time * 0.008 + i * 1.2) * 50;
    ctx.beginPath();
    ctx.moveTo(0, cy + offset + i * 50 - 60);
    for (let x = 0; x <= W; x += isMobile ? 20 : 12) {
      const y = cy + offset + Math.sin(x * 0.007 + time * 0.01 + i) * 35 + i * 50 - 60;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsl(${240 + i * 30}, 70%, 65%)`;
    ctx.lineWidth = 55; ctx.stroke();
  }
  ctx.restore();
}
 
function loop() {
  time++;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);
  drawAurora(); drawNebula();
  stars.forEach(s => {
    s.phase += s.speed * 0.02;
    const a = s.alpha * (0.5 + 0.5 * Math.sin(s.phase));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,190,255,${a})`; ctx.fill();
  });
  const spawnChance = isMobile ? 0.15 : 0.35;
  if (Math.random() < spawnChance) particles.push(new Particle(Math.random()*W, Math.random()*H, false));
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
}
 
window.addEventListener('resize', resize);
resize();
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
loop();
</script>
</body>
</html>
